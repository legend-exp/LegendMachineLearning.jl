# mlgroup004 — p18 deep, DetConcatMLP
mlp_detector_concat:
  input:
    sipm:
      features:
        - sipm_pe_sums_prompt_scaled
        - sipm_pe_sums_delayed_scaled
        - cos_proximity
      layout: by_channel
      ordering:
        enabled: true
        groups: [IB_top, IB_bottom, OB_top, OB_bottom]
    hpge:
      enabled: true
      features: [scaled_angle, scaled_z_center]
      output_dim: 24
      hidden_width: 64
      concat_after_layers: 0
  architecture:
    hidden_widths: [512, 256, 128, 64]
    activation: tanh
    dropout: 0.26
    batch_norm: true
  training:
    epochs: 350
    batch_size: 1024
    learning_rate: 8e-4
    weight_decay: 3.36e-3
    optimizer: adamw
    seed: 1234
    early_stopping_patience: 30
    lr_scheduler: cosine
    lr_min: 1.0e-6
    warmup_timeout: 300
